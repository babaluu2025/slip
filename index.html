<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalkulator Konobara ☁️</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
      background:#111; color:#fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .screen { 
      display:none; 
      padding:5px;
      min-height: 100vh;
    }
    
    .active { display:block; }
    
   .btn { 
      background:#444; 
      color:#fff; 
      padding:20px 15px; 
      border:none; 
      border-radius:15px; 
      font-size:22px; 
      width:100%; 
      cursor: pointer;
      transition: 0.05s linear;
      touch-action: manipulation;
      -webkit-user-select:none;
      user-select:none;
      margin-bottom: 8px;
    }
    
    .btn:active { background:#666; transform: scale(0.98); }
    
    .calc-display { 
      background:#000; 
      padding:25px; 
      font-size:36px; 
      border-radius:15px; 
      min-height:120px; 
      max-height:160px;
      text-align:right; 
      margin-bottom:20px;
      overflow-y: auto;
      word-wrap: break-word;
      line-height: 1.5;
    }
    
    .header { 
      font-size:24px; 
      margin-bottom:20px; 
      position: sticky;
      top: 0;
      background: #111;
      padding: 15px 0;
      z-index: 10;
    }
    
    .danger { background:#a00; }
    .highlight { color:#0f0; }
    
    .scroll-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: calc(100vh - 140px);
    }
    
    .home-content {
      padding-bottom: 25px;
    }
    
    .bottom-space {
      height: 25px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .calc-btn {
      background: #505050;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 32px;
      height: 80px;
      min-height: 80px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.05s linear;
      touch-action: manipulation;
      -webkit-user-select:none;
      user-select:none;
      will-change: transform;
      transform: translateZ(0);
    }

    .calc-btn:active {
      background: #707070;
      transform: scale(0.95);
    }

    .top-btn {
      background: #a5a5a5;
      color: #000;
      font-size: 28px;
    }

    .right-btn {
      background: #ff9500;
      color: #fff;
      font-size: 34px;
    }

    .num-btn {
      background: #333;
      color: #fff;
      font-size: 32px;
    }

    .zero-btn {
      grid-column: span 2;
      border-radius: 50px;
      justify-content: flex-start;
      padding-left: 30px;
    }

    .history-card {
      background:#1b1b1b;
      border-radius:18px;
      padding:18px;
      margin-bottom:14px;
    }

    .history-expression {
      font-size:28px;
      color:#fff;
      margin-bottom:10px;
      word-break: break-all;
    }

    .history-result {
      color:#57ff57;
      font-size:34px;
      font-weight:bold;
    }

    .history-time {
      color:#777;
      margin-top:10px;
      font-size:15px;
    }

    .sync-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-left: 10px;
    }
    .sync-online { background: #28a745; }
    .sync-offline { background: #dc3545; }

    @media (max-width: 480px) {
      .screen { padding: 8px; }
      .calc-display { font-size: 32px; min-height: 100px; max-height: 140px; padding: 22px; }
      .calc-btn { height: 75px; min-height: 75px; font-size: 28px; }
      .header { font-size: 22px; }
      .calc-grid { gap: 10px; }
      .right-btn { font-size: 30px; }
    }

    @media (max-width: 360px) {
      .calc-btn { height: 70px; min-height: 70px; font-size: 26px; }
      .calc-display { font-size: 30px; min-height: 90px; max-height: 130px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .calc-btn { height: 60px; min-height: 60px; font-size: 22px; }
      .calc-display { min-height: 70px; max-height: 90px; font-size: 26px; padding: 18px; }
      .header { font-size: 18px; margin-bottom: 12px; }
      .calc-grid { gap: 8px; }
    }
  </style>
</head>
<body>

  <div id="home" class="screen active">
    <div class="header">Izaberi konobara <span id="syncDot" class="sync-indicator sync-offline" title="Sinhronizacija"></span></div>
    <div class="scroll-container">
      <div class="home-content">
        <div id="waiterList"></div>
        <button class="btn" onclick="addWaiter()" style="background:#28a745;">➕ Dodaj konobara</button>
        <button class="btn" onclick="openManager()">👨‍💼 Menadžer</button>
        <button class="btn" onclick="exportData()" style="background:#2196F3;">📥 Export backup</button>
        <div class="bottom-space"></div>
      </div>
    </div>
  </div>

  <div id="calc" class="screen">
    <div class="header" id="waiterName"></div>
    <div class="calc-display" id="display">0</div>
    
    <div class="calc-grid">
      <button class="calc-btn top-btn" id="clearBtn">C</button>
      <button class="calc-btn top-btn" onclick="addToDisplay('(')">(</button>
      <button class="calc-btn top-btn" onclick="addToDisplay(')')">)</button>
      <button class="calc-btn top-btn" onclick="addToDisplay('/')">/</button>
      
      <button class="calc-btn num-btn" onclick="addToDisplay('7')">7</button>
      <button class="calc-btn num-btn" onclick="addToDisplay('8')">8</button>
      <button class="calc-btn num-btn" onclick="addToDisplay('9')">9</button>
      <button class="calc-btn right-btn" onclick="addToDisplay('*')">×</button>
      
      <button class="calc-btn num-btn" onclick="addToDisplay('4')">4</button>
      <button class="calc-btn num-btn" onclick="addToDisplay('5')">5</button>
      <button class="calc-btn num-btn" onclick="addToDisplay('6')">6</button>
      <button class="calc-btn right-btn" onclick="addToDisplay('-')">—</button>
      
      <button class="calc-btn num-btn" onclick="addToDisplay('1')">1</button>
      <button class="calc-btn num-btn" onclick="addToDisplay('2')">2</button>
      <button class="calc-btn num-btn" onclick="addToDisplay('3')">3</button>
      <button class="calc-btn right-btn" onclick="addToDisplay('+')">+</button>
      
      <button class="calc-btn num-btn zero-btn" onclick="addToDisplay('0')">0</button>
      <button class="calc-btn num-btn" onclick="addToDisplay('.')">.</button>
      <button class="calc-btn right-btn" onclick="calculate()">=</button>
      
      <button class="btn back-btn" onclick="goHome()" style="grid-column: span 4; margin-top: 10px; background: #2196F3; font-size: 20px;">↩ Nazad na konobare</button>
      
      <button class="btn" onclick="openHistory()" style="grid-column: span 4; margin-top:10px; background:#111; border:2px solid #2196F3; color:#2196F3; font-size:20px;">🕘 Istorija</button>
    </div>
  </div>

  <div id="historyScreen" class="screen">
    <div class="header" id="historyTitle">Istorija</div>
    <div class="scroll-container">
      <div id="historyList"></div>
      <button class="btn danger" onclick="clearHistory()" style="margin-top:15px;">🗑 Izbriši svu istoriju</button>
      <button class="btn" onclick="backToCalc()" style="margin-top:10px;background:#2196F3;">↩ Nazad na kalkulator</button>
      <div class="bottom-space"></div>
    </div>
  </div>

  <div id="manager" class="screen">
    <div class="header">Menadžerski pregled</div>
    <div class="scroll-container">
      <div id="report"></div>
      <button class="btn danger" onclick="resetAll()">🗑 Izbriši sve</button>
      <button class="btn" onclick="goHome()">↩ Nazad</button>
      <div class="bottom-space"></div>
    </div>
  </div>

  <script>
    // ==================== SUPABASE KONFIGURACIJA ====================
    const SUPABASE_URL = 'https://itoyvqqssqmeyxawvulq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_nbUWlCIXbB48NoBRhH4ucg_PfCAmau1';
    
    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {
      console.warn('Supabase offline, radi lokalno');
    }
    
    // ==================== PODACI ====================
    let currentWaiter = null;
    let clearTimer = null;
    let data = {};
    
    // ==================== CLOUD FUNKCIJE ====================
    async function loadFromCloud() {
      if (!supabaseClient) {
        loadLocal();
        updateSyncStatus(false);
        return;
      }
      try {
        const { data: result, error } = await supabaseClient
          .from('kalkulator_data')
          .select('*')
          .eq('id', 1)
          .single();
        
        if (result) {
          data = result.podaci || {};
          updateSyncStatus(true);
        } else if (error) {
          await supabaseClient.from('kalkulator_data').upsert({ id: 1, podaci: {} });
          updateSyncStatus(true);
        }
      } catch(e) {
        loadLocal();
        updateSyncStatus(false);
      }
      
      if (Object.keys(data).length === 0) initDefaultData();
    }
    
    async function saveToCloud() {
      saveLocal();
      if (!supabaseClient) return;
      try {
        await supabaseClient.from('kalkulator_data').upsert({ id: 1, podaci: data });
        updateSyncStatus(true);
      } catch(e) {
        updateSyncStatus(false);
      }
    }
    
    function loadLocal() {
      data = JSON.parse(localStorage.getItem("konobariData") || "{}");
      if (Object.keys(data).length === 0) initDefaultData();
    }
    
    function saveLocal() {
      localStorage.setItem("konobariData", JSON.stringify(data));
    }
    
    function updateSyncStatus(online) {
      const dot = document.getElementById('syncDot');
      if (dot) {
        dot.className = 'sync-indicator ' + (online ? 'sync-online' : 'sync-offline');
        dot.title = online ? '☁️ Sinhronizovano' : '📱 Lokalno';
      }
    }
    
    function initDefaultData() {
      for(let i = 1; i <= 15; i++) { 
        data["Konobar " + i] = { 
          expr: "", 
          total: 0, 
          numbers: [], 
          order: i,
          history: []
        }; 
      }
      saveLocal();
      saveToCloud();
    }
    
    // VIBRACIJA
    function vibrate(ms = 10) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }
    
    const operatorMap = {
      '×': '*',
      '—': '-',
      '+': '+',
      '/': '/'
    };

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }
    
    async function addWaiter() {
      vibrate(10);
      const count = Object.keys(data).length + 1;
      data["Konobar " + count] = {
        expr: "",
        total: 0,
        numbers: [],
        order: count,
        history: []
      };
      await saveToCloud();
      loadWaiters();
    }
    
    function loadWaiters() {
      const list = document.getElementById("waiterList");
      list.innerHTML = "";
      
      Object.entries(data)
        .sort((a, b) => (a[1].order || 0) - (b[1].order || 0))
        .forEach(([name, waiterData]) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = name + " (" + (waiterData.total || 0) + ")";
          
          btn.onclick = () => openCalc(name);
          
          let longPressTimer;
          btn.ontouchstart = (e) => {
            longPressTimer = setTimeout(() => {
              e.preventDefault();
              changeWaiterName(name);
            }, 500);
          };
          btn.ontouchend = () => {
            if (longPressTimer) clearTimeout(longPressTimer);
          };
          btn.oncontextmenu = (e) => {
            e.preventDefault();
            changeWaiterName(name);
          };
          
          list.appendChild(btn);
        });
    }

    async function changeWaiterName(oldName) {
      const newName = prompt("Novo ime za " + oldName, oldName);
      if (newName && newName.trim() !== "" && !data[newName]) {
        data[newName] = { ...data[oldName] };
        delete data[oldName];
        await saveToCloud();
        loadWaiters();
      } else if (data[newName]) {
        alert("Konobar sa tim imenom već postoji!");
      }
    }

    function openCalc(name) {
      currentWaiter = name;
      document.getElementById("waiterName").textContent = name;
      updateDisplay();
      showScreen("calc");
    }

    async function addToDisplay(char) {
  vibrate(8);
  if (!currentWaiter) return;

  const actualChar = operatorMap[char] || char;

  let expr = data[currentWaiter].expr || "0";

  if (expr === "0" && actualChar !== '.' && !['+','-','*','/','(',')'].includes(actualChar)) {
    expr = "";
  }

  const lastChar = expr.slice(-1);
  const operators = ['+','-','*','/'];

  if (operators.includes(lastChar) && operators.includes(actualChar)) {
    expr = expr.slice(0, -1);
  }

  expr += actualChar;
  data[currentWaiter].expr = expr;
  updateDisplay();

  saveLocal();
}

    function clearDisplay(shortPress = true) {
      if (!currentWaiter) return;
      
      if(shortPress) {
        let expr = data[currentWaiter].expr;
        if(expr.length > 0) {
          expr = expr.slice(0, -1);
          data[currentWaiter].expr = expr;
        }
      } else {
        data[currentWaiter].expr = "";
        data[currentWaiter].total = 0;
        data[currentWaiter].numbers = [];
      }
      updateDisplay();
      saveToCloud();
    }

    function updateDisplay() {
      const display = document.getElementById("display");
      let expr = data[currentWaiter]?.expr || "0";
      
      let displayExpr = expr
        .replace(/\*/g, '×')
        .replace(/\-/g, '—')
        .replace(/\./g, ',');
      
      displayExpr = displayExpr.replace(/([×—+/])/g, ' $1 ');
      
      display.textContent = displayExpr;
      display.scrollTop = display.scrollHeight;
    }

    async function calculate() {
      vibrate(10);
      if (!currentWaiter) return;
      
      try {
        const expr = data[currentWaiter].expr;
        if (!expr || expr === "0") return;
        
        const calcExpr = expr
          .replace(/×/g, '*')
          .replace(/—/g, '-')
          .replace(/,/g, '.');
        
        if (/[+\-*/]$/.test(calcExpr)) {
          throw new Error("Izraz završava operatorom");
        }
        
        const result = new Function(`return ${calcExpr}`)();
        const roundedResult = Math.round(result * 100) / 100;
        
        data[currentWaiter].total = roundedResult;
        
        const numbers = expr.match(/\d+[,\.]?\d*/g) || [];
        data[currentWaiter].numbers = numbers.map(n => parseFloat(n.replace(',', '.')));
        
        document.getElementById("display").textContent = roundedResult.toString().replace('.', ',');
        await saveToCloud();
        
      } catch(e) { 
        alert("Greška: Nevažeći matematički izraz"); 
        data[currentWaiter].expr = "";
        updateDisplay();
        await saveToCloud();
      }
    }

    async function saveCurrentToHistory() {
      if (!currentWaiter) return;
      const waiter = data[currentWaiter];
      if (!waiter) return;
      
      if (!waiter.expr || waiter.expr === "" || waiter.expr === "0") return;
      
      const lastHistory = waiter.history && waiter.history[0];
      if (lastHistory && lastHistory.expression === waiter.expr && lastHistory.result === waiter.total) {
        return;
      }
      
      if (!waiter.history) waiter.history = [];
      
      waiter.history.unshift({
        expression: waiter.expr,
        result: waiter.total,
        time: new Date().toLocaleString('sr-RS', {
          day:'2-digit',
          month:'2-digit',
          year:'numeric',
          hour:'2-digit',
          minute:'2-digit'
        })
      });
      
      if (waiter.history.length > 100) waiter.history.pop();
      await saveToCloud();
    }

    async function goHome() { 
      await saveCurrentToHistory();
      showScreen("home"); 
      loadWaiters(); 
    }

    function openHistory() {
      vibrate(10);
      if (!currentWaiter) return;
      
      const history = data[currentWaiter].history || [];
      
      document.getElementById("historyTitle").textContent = currentWaiter + " - Istorija";
      
      const list = document.getElementById("historyList");
      
      if(history.length === 0) {
        list.innerHTML = `<p style="color:#777; text-align:center; margin-top:40px; font-size:20px;">Nema istorije</p>`;
      } else {
        list.innerHTML = history.map(item => `
          <div class="history-card">
            <div class="history-expression">${item.expression.replace(/\*/g,'×').replace(/\-/g,'—')}</div>
            <div class="history-result">${item.result.toFixed(2)} €</div>
            <div class="history-time">${item.time}</div>
          </div>
        `).join('');
      }
      
      showScreen("historyScreen");
    }

    async function clearHistory() {
      if(confirm("Izbrisati svu istoriju?")) {
        if (data[currentWaiter]) {
          data[currentWaiter].history = [];
          await saveToCloud();
          openHistory();
        }
      }
    }

    function backToCalc() {
      showScreen("calc");
    }

    function openManager() {
      let rep = "";
      let numMap = {};
      
      Object.entries(data)
        .sort((a, b) => (a[1].order || 0) - (b[1].order || 0))
        .forEach(([name, waiterData]) => {
          const nums = waiterData.numbers || [];
          rep += `<p><b>${name}:</b> ${waiterData.total} (${nums.join(", ")})</p>`;
          nums.forEach(n => {
            if(!numMap[n]) numMap[n] = [];
            if(!numMap[n].includes(name)) numMap[n].push(name);
          });
        });
      
      rep += "<h3>Duplikati brojeva:</h3>";
      let hasDuplicates = false;
      for(let num in numMap) {
        if(numMap[num].length > 1) {
          rep += `<p class="highlight">Broj ${num} kod: ${numMap[num].join(", ")}</p>`;
          hasDuplicates = true;
        }
      }
      if (!hasDuplicates) rep += "<p>Nema dupliranih brojeva</p>";
      
      document.getElementById("report").innerHTML = rep;
      showScreen("manager");
    }

    async function resetAll() {
      if(confirm("Obrisati sve?")) {
        for(let name in data) { 
          data[name] = { 
            expr: "", 
            total: 0, 
            numbers: [], 
            order: data[name].order,
            history: []
          }; 
        }
        await saveToCloud();
        goHome();
      }
    }

    function exportData() {
      const exportObj = JSON.stringify(data, null, 2);
      const blob = new Blob([exportObj], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kalkulator_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ==================== INICIJALIZACIJA ====================
    window.addEventListener('load', async () => {
      await loadFromCloud();
      loadWaiters();
      
      const cBtn = document.getElementById("clearBtn");
      if(cBtn) {
        cBtn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          clearTimer = setTimeout(() => {
            clearDisplay(false);
          }, 700);
        }, {passive: false});
        
        cBtn.addEventListener('touchend', (e) => {
          e.preventDefault();
          if(clearTimer) { 
            clearTimeout(clearTimer); 
            clearDisplay(true);
          }
        }, {passive: false});
        
        cBtn.addEventListener('contextmenu', (e) => e.preventDefault());
      }
      
      if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log("SW OK"))
          .catch(err => console.log("SW ERROR", err));
      }
    });
  </script>
</body>
</html>
